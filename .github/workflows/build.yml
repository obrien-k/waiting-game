name: 'Build and Release Tauri App'

on:
  # Cutting a release = pushing a version tag. The tag is the single source of
  # truth for the release name — nothing is derived from the manifest anymore,
  # so the release can't drift from the tag (as v0.2.3 did).
  push:
    tags:
      - 'v*'
  # Manual re-run. Dispatch against a TAG ref, e.g.
  #   gh workflow run build.yml --ref v0.3.0
  # The job below is guarded to tags, so a dispatch against a branch is a no-op.
  workflow_dispatch:

# One in-flight build per ref; a newer push for the same tag supersedes an older run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    # Release only ever from a tag — never a branch. This guardrail is what stops
    # a stray dispatch from cutting a "main" release or building a stale version.
    if: startsWith(github.ref, 'refs/tags/')

    strategy:
      fail-fast: false
      matrix:
        # One build per OS.
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    # Needed to write to the Releases tab.
    permissions:
      contents: write

    steps:
      - name: Checkout the tag being released
        uses: actions/checkout@v4
        with:
          # Pin to the ref that triggered the run so a dispatch can never silently
          # build whatever happens to be on the default branch.
          ref: ${{ github.ref }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux needs GTK/WebKit to compile the Tauri shell.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and attach binaries to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The tag that triggered this run — the release attaches to THIS tag and
          # is named after it. tauri-action reuses the existing tag; it does not
          # move or re-create it.
          tagName: ${{ github.ref_name }}
          releaseName: 'The Waiting Game ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform from the assets below.'
          # Draft so it doesn't notify watchers — review, then publish by hand.
          releaseDraft: true
          prerelease: false
